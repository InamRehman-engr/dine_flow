services:
  db:
    image: postgres:15-alpine
    container_name: dineflow_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dineflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dineflow_redis
    restart: always
    networks:
      - dineflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dineflow_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - dineflow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dineflow_backend
    restart: always
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SECRET_KEY}}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      NGROK_API_URL: ${NGROK_API_URL:-http://host.docker.internal:4040}
      FLASK_ENV: ${FLASK_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-dineflow}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      CURRENCY: ${CURRENCY:-PKR}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dineflow_net

  frontend:
    build: ./frontend
    container_name: dineflow_frontend
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - backend
      - minio
    networks:
      - dineflow_net

  adminer:
    image: adminer:4
    container_name: dineflow_adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dineflow_net

volumes:
  pgdata:
  miniodata:

networks:
  dineflow_net:
    driver: bridge
