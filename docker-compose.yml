services:
  db:
    image: postgres:15-alpine
    container_name: dineflow_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dineflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dineflow_backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      FLASK_ENV: ${FLASK_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dineflow_net

  frontend:
    build: ./frontend
    container_name: dineflow_frontend
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - dineflow_net

  adminer:
    image: adminer:4
    container_name: dineflow_adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dineflow_net

volumes:
  pgdata:

networks:
  dineflow_net:
    driver: bridge
